<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes, viewport-fit=cover">
    <meta name="theme-color" content="#1a0a0a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Vinothèque">
    <title>Vinothèque Pro · Wine Cellar</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js">
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js">
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js">
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@capacitor/core/dist/capacitor.global.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@capacitor/filesystem/dist/plugin.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@capacitor/share/dist/plugin.min.js"></script>
    <style>
        :root {
            --bg: #0d0505;
            --bg2: #1a0a0a;
            --bg3: #2d1212;
            --gold: #d4a54e;
            --gold2: #f0d89a;
            --text: #f5ede4;
            --text2: #c4b4a4;
            --text3: #8a7a6c;
            --border: #4a2020;
            --border-gold: #b8944e;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            -webkit-tap-highlight-color: transparent;
            padding-bottom: 70px;
        }
        .app {
            max-width: 900px;
            margin: 0 auto;
            padding: 16px;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 0 16px;
            margin-bottom: 16px;
            border-bottom: 1px solid var(--border);
            flex-wrap: wrap;
            gap: 10px;
        }
        .header h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.8rem;
            font-weight: 600;
            background: linear-gradient(135deg, var(--gold2), var(--gold), #c42828);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .dev-badge {
            background: var(--bg3);
            color: var(--gold2);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.7rem;
            border: 1px solid var(--border-gold);
            font-weight: 500;
        }
        .user-chip {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--bg3);
            padding: 5px 14px 5px 5px;
            border-radius: 25px;
            border: 1px solid var(--border-gold);
            cursor: pointer;
            font-size: 0.8rem;
        }
        .user-avatar {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: linear-gradient(135deg, #9a7b3a, var(--gold));
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--bg);
            font-weight: 700;
            font-size: 0.8rem;
        }
        .btn {
            padding: 10px 18px;
            border-radius: 25px;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            border: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
            font-family: 'Inter', sans-serif;
        }
        .btn-gold {
            background: linear-gradient(135deg, #9a7b3a, var(--gold));
            color: #1a0a0a;
            font-weight: 600;
        }
        .btn-outline {
            background: transparent;
            border: 1px solid var(--border-gold);
            color: var(--gold);
        }
        .btn-outline:hover {
            background: rgba(139, 26, 26, 0.3);
        }
        .btn-sm {
            padding: 7px 12px;
            font-size: 0.7rem;
        }

        .nav-tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 16px;
            overflow-x: auto;
            border-bottom: 1px solid var(--border);
            padding-bottom: 6px;
        }
        .nav-tab {
            padding: 10px 16px;
            background: none;
            border: none;
            color: var(--text3);
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            border-radius: 20px 20px 0 0;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }
        .nav-tab:hover {
            color: var(--text2);
        }
        .nav-tab.active {
            color: var(--gold);
            background: rgba(212, 165, 78, 0.05);
            border-bottom: 2px solid var(--gold);
        }

        .toolbar {
            display: flex;
            gap: 8px;
            align-items: center;
            background: var(--bg3);
            border-radius: 30px;
            padding: 4px 4px 4px 16px;
            margin-bottom: 16px;
            border: 1px solid var(--border-gold);
            flex-wrap: wrap;
        }
        .toolbar input {
            flex: 1;
            min-width: 150px;
            padding: 12px 0;
            border: none;
            background: transparent;
            color: var(--text);
            font-size: 0.9rem;
            outline: none;
        }
        .toolbar input::placeholder {
            color: var(--text3);
        }
        .toolbar select {
            padding: 10px 14px;
            border-radius: 20px;
            border: 1px solid var(--border);
            background: var(--bg2);
            color: var(--text);
            font-size: 0.8rem;
        }
        .wine-count {
            padding: 6px 14px;
            background: var(--bg2);
            border-radius: 20px;
            border: 1px solid var(--border-gold);
            font-size: 0.75rem;
            color: var(--gold2);
            white-space: nowrap;
        }

        .action-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 14px;
            flex-wrap: wrap;
        }

        .wine-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 14px;
        }
        .wine-card {
            background: linear-gradient(145deg, var(--bg3), var(--bg2));
            border-radius: 20px;
            padding: 16px;
            border: 1px solid var(--border-gold);
            cursor: pointer;
            transition: all 0.25s;
            position: relative;
            overflow: hidden;
        }
        .wine-card:hover {
            transform: translateY(-2px);
            border-color: var(--gold);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
        }
        .wine-card:active {
            transform: scale(0.97);
        }
        .wine-img-container {
            width: 100%;
            height: 200px;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 12px;
            background: rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .wine-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            transition: transform 0.3s;
        }
        .wine-card:hover .wine-img {
            transform: scale(1.03);
        }
        .wine-img-placeholder {
            font-size: 5rem;
            opacity: 0.4;
        }
        .wine-type-strip {
            position: absolute;
            top: 10px;
            left: 10px;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.65rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .strip-red {
            background: rgba(180, 30, 30, 0.8);
            color: #fff;
        }
        .strip-white {
            background: rgba(200, 180, 100, 0.8);
            color: #1a0a0a;
        }
        .strip-rose {
            background: rgba(220, 150, 150, 0.8);
            color: #1a0a0a;
        }
        .strip-sparkling {
            background: rgba(180, 200, 100, 0.8);
            color: #1a0a0a;
        }
        .strip-dessert {
            background: rgba(200, 140, 50, 0.8);
            color: #fff;
        }
        .fav-icon {
            position: absolute;
            top: 10px;
            right: 10px;
            color: rgba(255, 255, 255, 0.6);
            font-size: 1.3rem;
            cursor: pointer;
            z-index: 2;
            transition: all 0.2s;
            filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.5));
        }
        .fav-icon:hover {
            transform: scale(1.2);
        }
        .fav-icon.active {
            color: #ff4757;
        }
        .wine-name {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.3rem;
            font-weight: 600;
            color: var(--gold2);
            line-height: 1.2;
            margin-bottom: 4px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .wine-origin {
            font-size: 0.75rem;
            color: var(--text2);
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .wine-origin i {
            color: var(--gold);
            font-size: 0.7rem;
        }
        .wine-meta-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 8px;
        }
        .wine-tag {
            font-size: 0.7rem;
            color: var(--text3);
            background: rgba(255, 255, 255, 0.05);
            padding: 3px 8px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .wine-tag i {
            color: var(--gold);
        }
        .wine-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 10px;
            border-top: 1px solid var(--border);
        }
        .wine-price {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--gold);
        }
        .wine-rating {
            display: flex;
            align-items: center;
            gap: 3px;
            color: var(--gold);
            font-size: 0.85rem;
        }
        .wine-rating .stars {
            letter-spacing: 2px;
        }
        .wine-rating .score {
            font-weight: 700;
            margin-left: 4px;
        }
        .fetch-photo-btn {
            position: absolute;
            bottom: 8px;
            right: 8px;
            background: rgba(212, 165, 78, 0.8);
            color: #1a0a0a;
            border: none;
            border-radius: 15px;
            padding: 4px 10px;
            font-size: 0.65rem;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.2s;
            font-weight: 600;
            z-index: 2;
        }
        .wine-img-container:hover .fetch-photo-btn {
            opacity: 1;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(5, 2, 2, 0.95);
            backdrop-filter: blur(8px);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .modal {
            background: linear-gradient(160deg, var(--bg3), var(--bg2));
            border-radius: 24px;
            padding: 24px;
            width: 100%;
            max-width: 550px;
            max-height: 85vh;
            overflow-y: auto;
            border: 2px solid var(--border-gold);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .modal-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.5rem;
            color: var(--gold);
        }
        .modal-close {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 1px solid var(--border);
            background: none;
            color: var(--text3);
            font-size: 1.1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modal-close:hover {
            border-color: var(--gold);
            color: var(--gold);
        }
        .form-group {
            margin-bottom: 14px;
        }
        .form-label {
            font-size: 0.75rem;
            color: var(--text3);
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .form-input,
        .form-select {
            width: 100%;
            padding: 12px 14px;
            border-radius: 14px;
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text);
            font-size: 0.9rem;
            font-family: 'Inter', sans-serif;
        }
        .form-input:focus,
        .form-select:focus {
            outline: none;
            border-color: var(--gold);
        }
        .photo-search-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            max-height: 300px;
            overflow-y: auto;
            margin: 12px 0;
            padding: 4px;
        }
        .photo-thumb {
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            border: 3px solid transparent;
            aspect-ratio: 1;
            transition: all 0.2s;
            background: rgba(0, 0, 0, 0.3);
        }
        .photo-thumb:hover {
            border-color: var(--gold);
        }
        .photo-thumb.selected {
            border-color: var(--gold);
            box-shadow: 0 0 15px rgba(212, 165, 78, 0.4);
        }
        .photo-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .detail-img {
            width: 100%;
            max-height: 220px;
            object-fit: contain;
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.3);
            margin-bottom: 16px;
        }
        .detail-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        .detail-item {
            padding: 10px 0;
            border-bottom: 1px solid var(--border);
        }
        .detail-item .label {
            font-size: 0.7rem;
            color: var(--text3);
        }
        .detail-item .value {
            font-size: 0.9rem;
            color: var(--text);
        }
        .wine-info-panel {
            margin-top: 16px;
            padding: 14px;
            background: rgba(212, 165, 78, 0.05);
            border-radius: 12px;
            border: 1px solid var(--border-gold);
        }
        .wine-info-panel .info-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .wine-info-content {
            font-size: 0.8rem;
            color: var(--text2);
            line-height: 1.6;
        }
        .wine-info-links {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg3);
            color: var(--gold2);
            padding: 12px 24px;
            border-radius: 30px;
            border: 1px solid var(--border-gold);
            z-index: 200;
            animation: slideUp 0.3s ease;
            font-size: 0.85rem;
            font-weight: 500;
        }
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }
        .hidden {
            display: none !important;
        }
        .spinner {
            display: inline-block;
            width: 24px;
            height: 24px;
            border: 3px solid var(--border);
            border-top-color: var(--gold);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text3);
        }
        .empty-state i {
            font-size: 4rem;
            opacity: 0.2;
            margin-bottom: 16px;
            display: block;
        }
        @media (max-width: 600px) {
            .wine-grid {
                grid-template-columns: 1fr;
            }
            .photo-search-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .detail-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="app">
        <!-- Header -->
        <header class="header">
            <h1>🍷 Vinothèque Pro</h1>
            <div class="dev-badge">Zakariae BOUZIDI IDRISSI</div>
            <div class="user-chip" onclick="showModal('authModal')">
                <div class="user-avatar" id="avatar">G</div>
                <span id="userDisplay">Guest</span>
                <span id="roleBadge" style="font-size:0.6rem;color:var(--gold);"></span>
            </div>
        </header>

        <!-- Navigation -->
        <nav class="nav-tabs">
            <button class="nav-tab active" data-tab="cellar">🍷 Cellar</button>
            <button class="nav-tab" data-tab="pairings">🍽️ Pairings</button>
            <button class="nav-tab" data-tab="favorites">❤️ Favorites</button>
            <button class="nav-tab admin-only hidden" data-tab="admin">👑 Admin</button>
        </nav>

        <!-- Search Bar -->
        <div class="toolbar" id="toolbar">
            <i class="fas fa-search" style="color:var(--gold);"></i>
            <input type="text" id="searchInput" placeholder="Search by name, grape, region, vintage...">
            <select id="typeFilter">
                <option value="">All Types</option>
                <option>Red</option>
                <option>White</option>
                <option>Rosé</option>
                <option>Sparkling</option>
                <option>Dessert</option>
            </select>
            <button class="btn btn-outline btn-sm" onclick="clearFilters()">✕</button>
            <span class="wine-count" id="wineCount">0 wines</span>
        </div>

        <!-- Action Bar -->
        <div class="action-bar">
            <label class="btn btn-outline btn-sm" style="cursor:pointer;">📂 Load CSV(s) <input type="file" id="csvInput" accept=".csv,text/csv" multiple hidden></label>
            <button class="btn btn-outline btn-sm" onclick="loadSampleWines()">🧪 Samples</button>
            <button class="btn btn-outline btn-sm admin-only hidden" onclick="exportBackup()">💾 Backup</button>
            <button class="btn btn-outline btn-sm admin-only hidden" onclick="document.getElementById('restoreInput').click()">📥 Restore</button>
            <input type="file" id="restoreInput" accept=".zip,.json" hidden onchange="restoreBackup(this)">
            <button class="btn btn-outline btn-sm admin-only hidden" onclick="fetchAllMissingPhotos()">📸 Auto-Photos</button>
        </div>

        <!-- Views -->
        <div id="cellarView"><div class="wine-grid" id="wineGrid"></div></div>
        <div id="pairingsView" class="hidden">
            <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;">
                <button class="btn btn-outline btn-sm dish-btn active" data-dish="beef">🥩 Beef</button>
                <button class="btn btn-outline btn-sm dish-btn" data-dish="lamb">🐑 Lamb</button>
                <button class="btn btn-outline btn-sm dish-btn" data-dish="pork">🐖 Pork</button>
                <button class="btn btn-outline btn-sm dish-btn" data-dish="poultry">🍗 Poultry</button>
                <button class="btn btn-outline btn-sm dish-btn" data-dish="seafood">🐟 Seafood</button>
                <button class="btn btn-outline btn-sm dish-btn" data-dish="cheese">🧀 Cheese</button>
                <button class="btn btn-outline btn-sm dish-btn" data-dish="vegetarian">🥗 Vegetarian</button>
            </div>
            <div class="wine-grid" id="pairingsGrid"></div>
        </div>
        <div id="favoritesView" class="hidden"><div class="wine-grid" id="favoritesGrid"></div></div>
        <div id="adminView" class="hidden">
            <div style="margin-bottom:14px;">
                <button class="btn btn-gold btn-sm" onclick="addNewWine()">+ Add Wine</button>
                <button class="btn btn-outline btn-sm" onclick="showModal('userManagerModal')" style="margin-left:6px;">👥 Users</button>
            </div>
            <div class="wine-grid" id="adminGrid"></div>
        </div>
    </div>

    <!-- Detail Modal -->
    <div class="modal-overlay hidden" id="detailModal">
        <div class="modal">
            <div class="modal-header">
                <h2 class="modal-title" id="detailTitle"></h2>
                <button class="modal-close" onclick="closeModal('detailModal')">✕</button>
            </div>
            <img id="detailImage" class="detail-img" src="" alt="">
            <div class="detail-grid" id="detailContent"></div>
            
            <!-- Wine Info Panel -->
            <div class="wine-info-panel">
                <div class="info-header">
                    <span style="color:var(--gold);font-weight:600;font-size:0.85rem;">🌐 Wine Information</span>
                    <button class="btn btn-outline btn-sm" onclick="fetchWineInfo()">🔍 Fetch Info</button>
                </div>
                <div class="wine-info-content" id="wineInfoContent">
                    <p>Click "Fetch Info" to get details from reliable wine sources.</p>
                </div>
                <div class="wine-info-links" id="wineInfoLinks"></div>
            </div>
            
            <div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap;">
                <button class="btn btn-outline btn-sm" id="detailEditBtn" onclick="editWineFromDetail()">✏️ Edit</button>
                <button class="btn btn-outline btn-sm" id="detailPhotoBtn" onclick="openPhotoSearch()">📸 Photo</button>
                <button class="btn btn-outline btn-sm" onclick="shareWine()">🔗 Share</button>
            </div>
        </div>
    </div>

    <!-- Photo Modal -->
    <div class="modal-overlay hidden" id="photoModal">
        <div class="modal">
            <div class="modal-header">
                <h2 class="modal-title">📸 Find Photos</h2>
                <button class="modal-close" onclick="closeModal('photoModal')">✕</button>
            </div>
            <p style="font-size:0.8rem;color:var(--text2);margin-bottom:12px;" id="photoWineLabel"></p>
            <div style="display:flex;gap:8px;margin-bottom:12px;">
                <button class="btn btn-gold btn-sm" onclick="searchWebPhotos()">🔍 Search Web</button>
                <button class="btn btn-outline btn-sm" onclick="searchUnsplashPhotos()">📷 Unsplash</button>
            </div>
            <div class="photo-search-grid" id="photoResults"></div>
            <div style="margin-top:12px;">

    <script>
        const OPENROUTER_API_KEY = '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';

        // ==================== APP STATE ====================
        const APP = {
            wines: [],

            currentUser: null,
            users: {},

            USERS_KEY: 'vp_pro_users',
            DEFAULT_ADMIN: { username: 'admin', password: 'admin123', role: 'admin', created: new Date().toISOString(),
                favorites: [] },

            async init() { await this.loadData(); this.updateUI(); this.renderCurrentView(); this.bindEvents(); },
            async loadData() {
                try { const w = await localforage.getItem(this.STORAGE_KEY);
                    this.wines = w ? w.map(w => this.enrich(w)) : []; } catch (e) { this.wines = []; }
                try { const u = await localforage.getItem(this.USERS_KEY);
                    this.users = u ? u : {}; } catch (e) { this.users = {}; }
                if (!this.users.admin) this.users.admin = { ...this.DEFAULT_ADMIN };
                if (!this.wines.length) this.loadSampleWines();
                this.save();
            },
            save() { try { localforage.setItem(this.STORAGE_KEY, this.wines); } catch (e) {}
                localforage.setItem(this.USERS_KEY, this.users); },
            enrich(w) {
                return {
                    Name: w.Name || 'Unknown Wine',
                    Reference: w.Reference || ('REF' + Date.now().toString(36).toUpperCase()),
                    Region: w.Region || '',
                    Vintage: w.Vintage || w.Year || 'NV',
                    Grape: w.Grape || w.Varietal || '',
                    Type: w.Type || this.detectType(w),
                    Dryness: w.Dryness || 'Dry',
                    Pairing: w.Pairing || '',
                    Aroma: w.Aroma || '',
                    Price: parseFloat(String(w.Price || 0).replace(/[^0-9.,]/g, '').replace(',', '.')) || 0,
                    Rating: parseInt(w.Rating) || Math.floor(Math.random() * 20 + 80),
                    Image: w.Image || ''
                };
            },
            detectType(w) {
                const n = (w.Name || '').toLowerCase();
                if (n.includes('rosé') || n.includes('rosato')) return 'Rosé';
                if (n.includes('champagne') || n.includes('sparkling') || n.includes('prosecco')) return
                    'Sparkling';
                if (n.includes('tba') || n.includes('sauternes') || n.includes('tokaji') || n.includes('icewine'))
                return 'Dessert';
                const g = (w.Grape || '').toLowerCase();
                if (g.match(/chardonnay|riesling|sauvignon|grüner|pinot grigio|gewürz/)) return 'White';
                return 'Red';
            },
            loadSampleWines() {
                const samples = [
                    { Name: "Château Margaux", Region: "Margaux, Bordeaux", Vintage: "2015",
                        Grape: "Cabernet Sauvignon, Merlot", Price: 650, Type: "Red", Rating: 98 },
                    { Name: "Romanée-Conti", Region: "Vosne-Romanée, Burgundy", Vintage: "2018",
                    Grape: "Pinot Noir", Price: 15000, Type: "Red", Rating: 99 },
                    { Name: "Sassicaia", Region: "Bolgheri, Tuscany", Vintage: "2019",
                        Grape: "Cabernet Sauvignon, Cabernet Franc", Price: 250, Type: "Red", Rating: 97 },
                    { Name: "Château d'Yquem", Region: "Sauternes, Bordeaux", Vintage: "2011",
                        Grape: "Sémillon, Sauvignon Blanc", Price: 350, Type: "Dessert", Rating: 98 },
                    { Name: "Krug Grande Cuvée", Region: "Champagne, France", Vintage: "NV",
                        Grape: "Chardonnay, Pinot Noir, Pinot Meunier", Price: 220, Type: "Sparkling", Rating: 96 },
                    { Name: "Cloudy Bay Sauvignon Blanc", Region: "Marlborough, New Zealand", Vintage: "2023",
                        Grape: "Sauvignon Blanc", Price: 35, Type: "White", Rating: 91 },
                    { Name: "Brunello di Montalcino", Region: "Tuscany, Italy", Vintage: "2016",
                    Grape: "Sangiovese", Price: 120, Type: "Red", Rating: 95 },
                    { Name: "Whispering Angel Rosé", Region: "Côtes de Provence, France", Vintage: "2023",
                        Grape: "Grenache, Cinsault, Rolle", Price: 28, Type: "Rosé", Rating: 90 }
                ];
                samples.forEach(s => { if (!this.wines.some(w => w.Name === s.Name && w.Vintage === s
                        .Vintage)) { this.wines.push(this.enrich(s)); } });
            },
            getFiltered() {
                const search = (document.getElementById('searchInput')?.value || '').toLowerCase().trim();
                const type = document.getElementById('typeFilter')?.value || '';
                return this.wines.filter(w => {
                    if (search) { const haystack =
                            `${w.Name} ${w.Reference} ${w.Grape} ${w.Region} ${w.Vintage}`
                            .toLowerCase(); if (!haystack.includes(search)) return false; }
                    if (type && w.Type !== type) return false;
                    return true;
                });
            },
            login(username, password) {
                const user = this.users[username];
                if (!user) return { ok: false, msg: 'User not found' };
                if (user.password !== password) return { ok: false, msg: 'Wrong password' };
                this.currentUser = username;
                this.favorites = new Set(user.favorites || []);
                this.updateUI();
                return { ok: true };
            },
            register(username, password) {
                if (this.users[username]) return { ok: false, msg: 'Username exists' };
                this.users[username] = { password, role: 'user', created: new Date().toISOString(),
                favorites: [] };
                this.save();
                return { ok: true };
            },
            logout() {
                if (this.currentUser && this.users[this.currentUser]) { this.users[this.currentUser].favorites =
                        Array.from(this.favorites);
                    this.save(); }
                this.currentUser = null;
                this.favorites.clear();
                this.updateUI();

            isAdmin() { return this.currentUser && this.users[this.currentUser]?.role === 'admin'; },
            updateUI() {
                document.getElementById('userDisplay').innerText = this.currentUser || 'Guest';
                document.getElementById('avatar').innerText = (this.currentUser || 'G')[0].toUpperCase();

                .isAdmin()));

            renderWineCard(w) {

                    `<div class="wine-img-placeholder">🍷</div>`;
                const stripClass = `strip-${w.Type.toLowerCase()}`;
                const stars = '★'.repeat(Math.floor((w.Rating - 80) / 4) + 1) + '☆'.repeat(4 - Math.floor((w
                    .Rating - 80) / 4));
                return `
            <div class="wine-card" onclick="APP.showDetail('${w.Reference}')">
                <div class="wine-img-container">
                    ${imgHtml}
                    <span class="wine-type-strip ${stripClass}">${w.Type}</span>

                </div>
                <div class="wine-name">${this.esc(w.Name)}</div>

                <div class="wine-meta-row">
                    <span class="wine-tag"><i class="fas fa-calendar-alt"></i> ${w.Vintage}</span>
                    <span class="wine-tag"><i class="fas fa-seedling"></i> ${this.esc(w.Grape).substring(0,20)}</span>
                </div>
                <div class="wine-footer">
                    <span class="wine-price">€${w.Price.toFixed(0)}</span>
                    <span class="wine-rating"><span class="stars">${stars}</span><span class="score">${w.Rating}</span></span>
                </div>
            </div>`;
            },
            renderCurrentView() {
                ['cellarView', 'pairingsView', 'favoritesView', 'adminView'].forEach(id => document
            .getElementById(id).classList.add('hidden'));
                const viewId = this.currentTab + 'View';
                document.getElementById(viewId).classList.remove('hidden');
                document.getElementById('toolbar').style.display = (this.currentTab === 'cellar' || this
                    .currentTab === 'favorites') ? 'flex' : 'none';
                if (this.currentTab === 'cellar') this.renderCellar();
                else if (this.currentTab === 'pairings') this.renderPairings();
                else if (this.currentTab === 'favorites') this.renderFavorites();
                else if (this.currentTab === 'admin' && this.isAdmin()) this.renderAdmin();
                document.querySelectorAll('.nav-tab').forEach(t => t.classList.toggle('active', t.dataset.tab ===
                    this.currentTab));
            },
            renderCellar() {
                const filtered = this.getFiltered();
                document.getElementById('wineCount').innerText =
                    `${filtered.length} wine${filtered.length !== 1 ? 's' : ''}`;
                const grid = document.getElementById('wineGrid');
                grid.innerHTML = filtered.length ? filtered.map(w => this.renderWineCard(w)).join('') :
                    '<div class="empty-state"><i>🍷</i><p>No wines found. Import CSV or load samples.</p></div>';
            },
            renderPairings() {
                const types = { beef: ['Red'], lamb: ['Red'], pork: ['Red', 'White'], poultry: ['White',
                        'Red'
                    ], seafood: ['White', 'Sparkling'], cheese: ['Red', 'White', 'Dessert'],
                    vegetarian: ['White', 'Rosé'] };
                const suggestions = this.wines.filter(w => (types[this.currentDish] || ['Red']).includes(w
                .Type)).slice(0, 12);
                document.getElementById('pairingsGrid').innerHTML = suggestions.length ? suggestions.map(w =>
                    this.renderWineCard(w)).join('') :
                    '<div class="empty-state"><i>🍽️</i><p>Add wines to see pairings.</p></div>';
            },
            renderFavorites() {
                const favs = this.wines.filter(w => this.favorites.has(w.Reference));
                document.getElementById('favoritesGrid').innerHTML = favs.length ? favs.map(w => this
                    .renderWineCard(w)).join('') :
                    '<div class="empty-state"><i>❤️</i><p>Tap the heart on wines to add favorites.</p></div>';
            },
            renderAdmin() {
                document.getElementById('adminGrid').innerHTML = this.wines.map((w, i) => `
            <div class="wine-card">
                <div class="wine-img-container" style="height:120px;">
                    ${w.Image ? `<img src="${this.esc(w.Image)}" class="wine-img" loading="lazy">` : '<div class="wine-img-placeholder" style="font-size:3rem;">🍷</div>'}
                </div>
                <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;">
                    <input value="${this.esc(w.Name)}" class="form-input" style="flex:1;min-width:120px;padding:8px;" data-idx="${i}" data-field="Name" placeholder="Name">
                    <select class="form-input" style="width:100px;padding:8px;" data-idx="${i}" data-field="Type">
                        ${['Red','White','Rosé','Sparkling','Dessert'].map(t => `<option ${w.Type===t?'selected':''}>${t}</option>`).join('')}
                    </select>
                    <input type="number" value="${w.Price}" class="form-input" style="width:80px;padding:8px;" data-idx="${i}" data-field="Price" step="0.01">
                </div>
                <div style="display:flex;gap:6px;margin-top:8px;">
                    <button class="btn btn-outline btn-sm" onclick="APP.editPhoto('${w.Reference}')">📸</button>
                    <button class="btn btn-outline btn-sm" onclick="APP.fetchPhoto('${w.Reference}')">🔍</button>
                    <button class="btn btn-outline btn-sm" onclick="APP.deleteWine(${i})">🗑️</button>
                </div>
            </div>`).join('');
                document.querySelectorAll('#adminGrid input, #adminGrid select').forEach(el => { el
                .addEventListener('change', function() { const i = parseInt(this.dataset.idx); if (!isNaN(
                        i) && APP.wines[i]) { APP.wines[i][this.dataset.field] = this.dataset
                        .field === 'Price' ? parseFloat(this.value) || 0 : this.value;
                        APP.save(); } }); });
            },
            toggleFavorite(ref) { if (!this.currentUser) { toast('Please sign in first'); return; } this.favorites
                .has(ref) ? this.favorites.delete(ref) : this.favorites.add(ref);
                this.users[this.currentUser].favorites = Array.from(this.favorites);
                this.save();
                this.renderCurrentView(); },
            showDetail(ref) {
                const w = this.wines.find(w => w.Reference === ref); if (!w) return;
                this.detailRef = ref;
                document.getElementById('detailTitle').innerText = w.Name;
                document.getElementById('detailImage').src = w.Image || '';
                document.getElementById('detailImage').style.display = w.Image ? 'block' : 'none';
                document.getElementById('detailContent').innerHTML = `
            <div class="detail-item"><span class="label">Reference</span><span class="value">${w.Reference}</span></div>
            <div class="detail-item"><span class="label">Rating</span><span class="value" style="color:var(--gold);">${'★'.repeat(Math.floor((w.Rating-80)/4)+1)} ${w.Rating}/100</span></div>
            <div class="detail-item"><span class="label">Grape</span><span class="value">${this.esc(w.Grape) || '—'}</span></div>
            <div class="detail-item"><span class="label">Region</span><span class="value">${this.esc(w.Region) || '—'}</span></div>
            <div class="detail-item"><span class="label">Vintage</span><span class="value">${w.Vintage}</span></div>
            <div class="detail-item"><span class="label">Type</span><span class="value">${w.Type} · ${w.Dryness}</span></div>
            <div class="detail-item" style="grid-column:1/-1;"><span class="label">Aroma</span><span class="value">${this.esc(w.Aroma) || 'Complex and elegant'}</span></div>
            <div class="detail-item" style="grid-column:1/-1;"><span class="label">Pairing</span><span class="value">${this.esc(w.Pairing) || 'Versatile'}</span></div>
            <div class="detail-item" style="grid-column:1/-1;"><span class="label">Price</span><span class="value" style="font-size:1.5rem;color:var(--gold);">€${w.Price.toFixed(2)}</span></div>`;
                document.getElementById('wineInfoContent').innerHTML =
                    '<p>Click "Fetch Info" to get details from reliable wine sources.</p>';
                document.getElementById('wineInfoLinks').innerHTML = '';
                document.getElementById('detailEditBtn').style.display = this.isAdmin() ? 'inline-flex' : 'none';
                document.getElementById('detailPhotoBtn').style.display = this.isAdmin() ? 'inline-flex' : 'none';
                document.getElementById('detailModal').classList.remove('hidden');
            },
            async fetchWineInfo() {
                if (!this.detailRef) return;
                const wine = this.wines.find(w => w.Reference === this.detailRef);
                if (!wine) return;
                const contentEl = document.getElementById('wineInfoContent');
                const linksEl = document.getElementById('wineInfoLinks');
                contentEl.innerHTML =
                    '<p style="text-align:center;"><span class="spinner"></span> Fetching wine information...</p>';
                linksEl.innerHTML = '';
                const query = encodeURIComponent(`${wine.Name} ${wine.Vintage}`);
                try {
                    const response = await fetch('https://openrouter.ai/api/v1/chat/completions', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${OPENROUTER_API_KEY}`,
                            'HTTP-Referer': window.location.href,
                            'X-Title': 'Vinotheque Wine App'
                        },
                        body: JSON.stringify({
                            model: 'google/gemini-2.0-flash-001',
                            messages: [{ role: 'user',
                                content: `Provide detailed wine information for "${wine.Name}" (${wine.Vintage}) from ${wine.Region}. Include: Producer/Château background, Grape composition (${wine.Grape}), Tasting notes and aroma profile, Food pairing suggestions, Aging potential, Average price range, Critical acclaim (scores from Parker, Wine Spectator, etc.). Keep it concise but informative. Format with bullet points (•). If you don't know specific details, say "Information not available" instead of guessing.` }],
                            max_tokens: 800
                        })
                    });
                    const data = await response.json();
                    const aiContent = data.choices?.[0]?.message?.content ||
                        'Unable to fetch wine information.';
                    contentEl.innerHTML = aiContent.replace(/•/g, '<br>🍷').replace(/\n\n/g, '<br><br>');
                    linksEl.innerHTML = `
                <a href="https://www.vivino.com/search/wines?q=${query}" target="_blank" class="btn btn-outline btn-sm">🍷 Vivino</a>
                <a href="https://www.wine-searcher.com/find/${query}" target="_blank" class="btn btn-outline btn-sm">💰 Wine-Searcher</a>
                <a href="https://www.cellartracker.com/list.asp?O=${query}" target="_blank" class="btn btn-outline btn-sm">📊 CellarTracker</a>
                <a href="https://www.google.com/search?q=${query}+wine+review" target="_blank" class="btn btn-outline btn-sm">🔍 Google</a>`;
                } catch (error) {
                    contentEl.innerHTML =
                        '<p style="color:#c7522a;">Error fetching information. Please try again.</p>';
                    linksEl.innerHTML = `
                <a href="https://www.vivino.com/search/wines?q=${query}" target="_blank" class="btn btn-outline btn-sm">🔍 Search on Vivino</a>
                <a href="https://www.wine-searcher.com/find/${query}" target="_blank" class="btn btn-outline btn-sm">💰 Check Prices</a>`;
                }
            },
            editWineFromDetail() { if (!this.detailRef || !this.isAdmin()) return; const w = this.wines.find(w => w
                    .Reference === this.detailRef); if (!w) return;
                document.getElementById('editName').value = w.Name;
                document.getElementById('editRegion').value = w.Region;
                document.getElementById('editVintage').value = w.Vintage;
                document.getElementById('editGrape').value = w.Grape;
                document.getElementById('editType').value = w.Type;
                document.getElementById('editPrice').value = w.Price;
                document.getElementById('editRating').value = w.Rating;
                this.editingRef = this.detailRef;
                document.getElementById('editWineModal').classList.remove('hidden'); },
            saveWineEdit() { if (!this.editingRef) return; const w = this.wines.find(w => w.Reference === this
                    .editingRef); if (!w) return;
                w.Name = document.getElementById('editName').value || w.Name;
                w.Region = document.getElementById('editRegion').value;
                w.Vintage = document.getElementById('editVintage').value;
                w.Grape = document.getElementById('editGrape').value;
                w.Type = document.getElementById('editType').value;
                w.Price = parseFloat(document.getElementById('editPrice').value) || 0;
                w.Rating = parseInt(document.getElementById('editRating').value) || 80;
                this.save();
                document.getElementById('editWineModal').classList.add('hidden');
                this.renderCurrentView();
                toast('Wine saved! ✅'); },
            editPhoto(ref) { this.editingRef = ref; const w = this.wines.find(w => w.Reference === ref); this
                    .selectedPhotoUrl = w?.Image || '';
                document.getElementById('photoUrlInput').value = w?.Image || '';
                document.getElementById('photoWineLabel').innerText = w?.Name || '';
                document.getElementById('photoResults').innerHTML =
                    '<p style="text-align:center;color:var(--text3);">Click search to find photos</p>';
                document.getElementById('photoModal').classList.remove('hidden'); },
            openPhotoSearch() { if (this.detailRef) this.editPhoto(this.detailRef); },
            searchWebPhotos() { const w = this.wines.find(w => w.Reference === this.editingRef); if (!w)
            return; const grid = document.getElementById('photoResults');
                grid.innerHTML = '<p style="text-align:center;"><span class="spinner"></span> Searching...</p>';
                const query = encodeURIComponent(`${w.Name} ${w.Vintage} ${w.Type} wine`);
                const urls = []; for (let i = 0; i < 12; i++) { urls.push(
                        `https://source.unsplash.com/featured/400x400/?wine,bottle,${query}&sig=${Date.now()+i}`
                        ); }
                setTimeout(() => { grid.innerHTML = urls.map((url, i) => `
                <div class="photo-thumb" onclick="APP.selectPhoto('${url}', this)"><img src="${url}" loading="lazy" onerror="this.parentElement.style.display='none';"></div>`)
                        .join(''); }, 600); },
            searchUnsplashPhotos() { const w = this.wines.find(w => w.Reference === this.editingRef); if (!w)
            return; const grid = document.getElementById('photoResults');
                grid.innerHTML =
                    '<p style="text-align:center;"><span class="spinner"></span> Searching Unsplash...</p>';
                const queries = [`${w.Name} wine`, `${w.Grape} wine bottle`, `${w.Region} vineyard`,
                    `${w.Type} wine bottle`]; const urls = [];
                queries.forEach(q => { const eq = encodeURIComponent(q); for (let i = 0; i < 4; i++) { urls
                .push(
                        `https://source.unsplash.com/featured/400x400/?${eq}&sig=${Date.now()+i+Math.random()}`
                        ); } });
                setTimeout(() => { grid.innerHTML = urls.map((url, i) => `
                <div class="photo-thumb" onclick="APP.selectPhoto('${url}', this)"><img src="${url}" loading="lazy" onerror="this.parentElement.style.display='none';"></div>`)
                        .join(''); }, 600); },
            selectPhoto(url, element) { this.selectedPhotoUrl = url;
                document.getElementById('photoUrlInput').value = url;
                document.querySelectorAll('.photo-thumb').forEach(t => t.classList.remove('selected'));
                element.classList.add('selected'); },
            saveWinePhoto() { const url = document.getElementById('photoUrlInput').value.trim() || this
                    .selectedPhotoUrl; if (!url || !this.editingRef) return; const w = this.wines.find(w => w
                    .Reference === this.editingRef); if (w) { w.Image = url;
                    this.save();
                    document.getElementById('photoModal').classList.add('hidden');
                    this.renderCurrentView();
                    toast('Photo saved! ✅'); } },
            removeWinePhoto() { if (!this.editingRef) return; const w = this.wines.find(w => w.Reference === this
                    .editingRef); if (w) { w.Image = '';
                    this.save();
                    document.getElementById('photoModal').classList.add('hidden');
                    this.renderCurrentView();
                    toast('Photo removed'); } },
            async fetchPhoto(ref) { const w = this.wines.find(w => w.Reference === ref); if (!w)
            return;
                toast('Searching photo...'); const query = encodeURIComponent(`${w.Name} wine bottle`); for (
                    let i = 0; i < 8; i++) { const url =
                        `https://source.unsplash.com/featured/400x500/?wine,bottle,${query}&sig=${i}`; try { const
                        img = new Image();
                        img.src = url; await new Promise((res, rej) => { img.onload = res;
                            img.onerror = rej;
                            setTimeout(() => rej(), 3000); });
                        w.Image = url;
                        this.save();
                        this.renderCurrentView();
                        toast('Photo found! ✅'); return; } catch (e) { continue; } } this.editPhoto(
                ref);
                toast('Opening search...'); },
            async fetchAllMissingPhotos() { if (!this.isAdmin()) return; const missing = this.wines.filter(w => !
                    w.Image); if (!missing.length) { toast('All wines have photos'); return; }
                toast(`Fetching ${missing.length} photos...`); for (const w of missing) { await this.fetchPhoto(
                        w.Reference); await new Promise(r => setTimeout(r, 600)); } },
            deleteWine(i) { if (confirm(`Delete "${this.wines[i].Name}"?`)) { this.wines.splice(i, 1);
                    this.save();
                    this.renderCurrentView();
                    toast('Wine deleted'); } },
            addNewWine() { this.wines.push(this.enrich({ Name: 'New Wine ' + Date.now().toString(36), Price: 0,
                    Type: 'Red', Vintage: new Date().getFullYear().toString() }));
                this.save();
                this.renderCurrentView();
                toast('New wine added'); },
            async importCSV(text) { return new Promise((resolve) => { Papa.parse(text, { header: true,
                    skipEmptyLines: true, complete: (results) => { let imported = 0;
                        results.data.forEach(row => { if (row.Name && row.Name.trim()) { const wine =
                                this.enrich(row); if (!this.wines.some(w => w.Name === wine.Name &&
                                    w.Vintage === wine.Vintage && w.Reference === wine
                                    .Reference)) { this.wines.push(wine);
                                imported++; } } });
                        resolve(imported); }, error: () => resolve(0) }); }); },
            async exportBackup() { 
                if (!this.isAdmin()) return;
                toast('Creating backup...'); 
                const zip = new JSZip();
                zip.file('wines.json', JSON.stringify(this.wines));
                zip.file('users.json', JSON.stringify(this.users)); 
                const blob = await zip.generateAsync({ type: 'blob' });
                const fileName = `vinotheque_backup_${new Date().toISOString().split('T')[0]}.zip`;

                if (window.Capacitor && window.capacitorFilesystem && window.capacitorShare) {
                    try {
                        const reader = new FileReader();
                        reader.readAsDataURL(blob);
                        reader.onloadend = async () => {
                            const base64data = reader.result.split(',')[1];
                            const writeResult = await capacitorFilesystem.Filesystem.writeFile({
                                path: fileName,
                                data: base64data,
                                directory: 'CACHE'
                            });
                            await capacitorShare.Share.share({
                                title: 'Vinothèque Backup',
                                url: writeResult.uri,
                                dialogTitle: 'Save Backup File'
                            });
                            toast('Backup ready to save! 💾');
                        };
                    } catch (e) {
                        toast('Error creating native backup');
                        console.error(e);
                    }
                } else {
                    saveAs(blob, fileName);
                    toast('Backup downloaded! 💾'); 
                }
            },
            async restoreBackup(input) { const file = input.files[0]; if (!file)
            return;
                toast('Restoring backup...'); try { if (file.name.endsWith('.zip')) { const zip = await JSZip
                        .loadAsync(file); const wf = zip.file('wines.json'); if (wf) this.wines = JSON
                        .parse(await wf.async('text')).map(w => this.enrich(w)); const uf = zip.file(
                            'users.json'); if (uf) this.users = JSON.parse(await uf.async('text')); } else { const
                        text = await file.text(); const data = JSON.parse(text); if (data.wines) this.wines =
                        data.wines.map(w => this.enrich(w)); if (data.users) this.users = data
                    .users; } this.save();
                    this.renderCurrentView();
                    this.updateUI();
                    toast('Restored successfully! ✅'); } catch (e) { toast('Error restoring file');
                    console.error(e); }
                input.value = ''; },
            shareWine() { const w = this.wines.find(w => w.Reference === this.detailRef); if (!w) return; const
                text =
                    `🍷 ${w.Name} (${w.Vintage})\n📍 ${w.Region}\n🍇 ${w.Grape}\n💰 €${w.Price.toFixed(0)}\nRating: ${w.Rating}/100`; if (
                    navigator.share) { navigator.share({ title: w.Name, text }).catch(() => {}); } else { navigator
                        .clipboard.writeText(text).then(() => toast('Copied to clipboard!')); } },
            esc(t) { return t ? String(t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;',
                    '"': '&quot;', "'": '&#039;' })[c]) : ''; },
            bindEvents() {
                document.getElementById('searchInput').addEventListener('input', () => this.renderCellar());
                document.getElementById('searchInput').addEventListener('keypress', e => { if (e.key ===
                        'Enter') this.renderCellar(); });
                document.getElementById('typeFilter').addEventListener('change', () => this.renderCellar());
                document.getElementById('csvInput').addEventListener('change', async (e) => { const files =
                        Array.from(e.target.files); let total = 0; for (const file of files) { const text =
                            await file.text();
                        total += await this.importCSV(text); } this.save();
                    this.renderCurrentView();
                    toast(`Imported ${total} wines from ${files.length} file(s)!`);
                    e.target.value = ''; });
                document.querySelectorAll('.nav-tab').forEach(tab => { tab.addEventListener('click', () => { this
                        .currentTab = tab.dataset.tab;
                        this.renderCurrentView(); }); });
                document.querySelectorAll('.dish-btn').forEach(btn => { btn.addEventListener('click',
                function() {
                        document.querySelectorAll('.dish-btn').forEach(b => b.classList.remove(
                            'active'));
                        this.classList.add('active');
                        APP.currentDish = this.dataset.dish;
                        APP.renderPairings(); }); });
                document.querySelectorAll('.modal-overlay').forEach(m => { m.addEventListener('click',
                function(e) { if (e.target === this) this.classList.add('hidden'); }); });
                document.addEventListener('keydown', e => { if (e.key === 'Escape') { document.querySelectorAll(
                        '.modal-overlay').forEach(m => m.classList.add('hidden')); } });
            }
        };

        // Global functions
        function toast(msg) { const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.remove('hidden');
            clearTimeout(t._timeout);
            t._timeout = setTimeout(() => t.classList.add('hidden'), 2500); }

        function showModal(id) { document.getElementById(id).classList.remove('hidden'); }

        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

        function clearFilters() { document.getElementById('searchInput').value = '';
            document.getElementById('typeFilter').value = '';
            APP.renderCellar(); }

        function handleLogin() { const u = document.getElementById('authUser').value.trim(); const p = document
            .getElementById('authPass').value; if (!u) return toast('Enter username'); const r = APP.login(u, p); if (
                r.ok) { closeModal('authModal');
                APP.renderCurrentView();
                toast(`Welcome, ${u}!`); } else toast(r.msg); }

        function handleRegister() { const u = document.getElementById('authUser').value.trim(); const p = document
            .getElementById('authPass').value; if (!u || !p) return toast('Fill all fields'); const r = APP.register(u,
                p); if (r.ok) toast('Account created! You can now sign in.'); else toast(r.msg); }

        function handleLogout() { APP.logout();
            closeModal('authModal');
            APP.renderCurrentView();
            toast('Signed out'); }

        function loadSampleWines() { APP.loadSampleWines();
            APP.save();
            APP.renderCurrentView();
            toast('Samples loaded!'); }

        function exportBackup() { APP.exportBackup(); }

        function restoreBackup(input) { APP.restoreBackup(input); }

        function fetchAllMissingPhotos() { APP.fetchAllMissingPhotos(); }

        function addNewWine() { APP.addNewWine(); }

        function editWineFromDetail() { APP.editWineFromDetail(); }

        function openPhotoSearch() { APP.openPhotoSearch(); }

        function shareWine() { APP.shareWine(); }

        function searchWebPhotos() { APP.searchWebPhotos(); }

        function searchUnsplashPhotos() { APP.searchUnsplashPhotos(); }

        function saveWinePhoto() { APP.saveWinePhoto(); }

        function removeWinePhoto() { APP.removeWinePhoto(); }

        function uploadDevicePhoto(input) { const file = input.files[0]; if (!file) return; const reader = new
            FileReader();
            reader.onload = e => { document.getElementById('photoUrlInput').value = e.target.result;
                APP.selectedPhotoUrl = e.target.result;
                toast('Photo loaded from device'); };
            reader.readAsDataURL(file); }

        function saveWineEdit() { APP.saveWineEdit(); }

        function fetchWineInfo() { APP.fetchWineInfo(); }

        function addUserPrompt() { const name = prompt('New username:'); if (name && !APP.users[name]) { APP.users[
                name] = { password: 'user123', role: 'user', created: new Date().toISOString(),
            favorites: [] };
            APP.save();
            renderUserList();
            toast(`User ${name} created`); } else if (name) toast('Username exists'); }

        function deleteUser(name) { if (name === 'admin') return toast('Cannot delete admin'); if (confirm(
                `Delete user "${name}"?`)) { delete APP.users[name];
            APP.save();
            renderUserList();
            toast('User deleted'); } }

        function renderUserList() { document.getElementById('userList').innerHTML = Object.entries(APP.users).map(([
                name, data
            ]) => `
            <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);">
                <div><strong>${name}</strong> <span style="color:var(--gold);font-size:0.7rem;">${data.role.toUpperCase()}</span></div>
                <div>
                    <span style="font-size:0.7rem;color:var(--text3);margin-right:8px;">${(data.favorites||[]).length} favs</span>
                    ${name !== 'admin' ? `<button class="btn btn-outline btn-sm" onclick="deleteUser('${name}')">🗑️</button>` : ''}
                </div>
            </div>`).join(''); }

        // Override showModal for user manager
        const origShowModal = showModal;
        showModal = function(id) { if (id === 'userManagerModal') renderUserList();
            origShowModal(id); };

        // Initialize
        APP.init();
    </script>
</body>
</html>
